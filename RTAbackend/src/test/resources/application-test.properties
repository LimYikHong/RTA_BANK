# ============================================================
# Test profile — uses H2 in-memory database, disables Flyway,
# Kafka, MinIO, SSL, and external services.
# ============================================================

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — auto-create schema from entities (no Flyway in tests)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for unit tests
spring.flyway.enabled=false

# Disable data.sql script initialization (MySQL-specific, incompatible with H2)
spring.sql.init.mode=never

# Disable SSL for tests
server.ssl.enabled=false

# Disable Kafka (avoid connection errors in tests)
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.producer.properties.max.block.ms=100
spring.kafka.admin.auto-create=false

# Stub MinIO config (not actually connected in unit tests)
minio.endpoint=http://localhost:19090
minio.accessKey=test
minio.secretKey=test
minio.bucket=test-bucket
minio.result-bucket=test-result

# Internal channel config (stubs)
rta.internal.api-key=test-api-key
rta.internal.allowed-ips=127.0.0.1
rta.consumer.base-url=https://localhost:18882
rta.consumer.public-key-path=/api/internal/public-key
rta.consumer.batch-upload-path=/api/internal/batch-upload
rta.consumer.api-key=test-api-key
rta.merchant.base-url=https://localhost:18881
rta.merchant.batch-return-path=/api/internal/batch-return
rta.merchant.report-path=/api/internal/report
rta.merchant.api-key=test-api-key

# Kafka topics
rta.kafka.topic.merchant-created=test-merchant-created
rta.kafka.topic.batch-request=test-batch-request
rta.kafka.topic.batch-response=test-batch-response
