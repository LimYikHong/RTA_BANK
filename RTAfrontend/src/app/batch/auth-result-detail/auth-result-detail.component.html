<div class="page-header">
  <div class="header-left">
    <button class="btn-back" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5" /><polyline points="12 19 5 12 12 5" />
      </svg>
      Back to List
    </button>
    <h1 *ngIf="batch">Authorization Result — {{ batch.batchReference }}</h1>
  </div>
  <div class="header-actions" *ngIf="pdfUrl">
    <button class="btn-action btn-download" (click)="downloadPdf()" title="Download PDF"></button>
  </div>
</div>

<!-- Loading -->
<div *ngIf="isLoading" class="loading-text">Generating PDF report...</div>

<!-- PDF Preview -->
<div class="pdf-viewer-container" *ngIf="!isLoading && pdfUrl">
  <iframe [src]="pdfUrl" class="pdf-iframe"></iframe>
</div>

<!-- Error -->
<div *ngIf="!isLoading && !pdfUrl" class="error-text">
  <p>Failed to generate the authorization result report.</p>
</div>
